test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Production files on S3 in São Paulo (spec 20, D-595). The bucket encrypts every object
# with its KMS key (SSE-KMS); the credentials come from AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY, set only in Railway. Files are never public: the application
# serves them after checking who asks (RN-01-014).
amazon:
  service: S3
  region: <%= ENV.fetch("AWS_REGION", "sa-east-1") %>
  bucket: <%= ENV.fetch("S3_FILES_BUCKET", "catalysthr-files-464986173446-sa-east-1-an") %>
