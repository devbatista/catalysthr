# Scheduled jobs (sidekiq-cron, D-108). Every cron names its time zone, in Brasília time:
# without one, sidekiq-cron reads it in the Rails time zone (et-orbi), not in UTC.
# Each spec adds its jobs here. Example:
#
# billing_daily_usage:
#   cron: "0 1 * * * America/Sao_Paulo"
#   class: "Billing::DailyUsageJob"
#   queue: default

# Releases subdomains whose 90-day redirect is over (spec 01, RN-01-022)
brands_release_expired_subdomains:
  cron: "0 3 * * * America/Sao_Paulo"
  class: "Brands::ReleaseExpiredSubdomainsJob"
  queue: "default"

# Asks SES about the brands' pending and failed e-mail domains (spec 01, RN-01-040, D-596)
brands_verify_email_domains:
  cron: "15 * * * * America/Sao_Paulo"          # every hour
  class: "Brands::VerifyEmailDomainJob"
  queue: "default"

# Deletes expired or forgotten remembered devices (spec 02, RN-02-043)
trusted_devices_purge_expired:
  cron: "10 3 * * * America/Sao_Paulo"
  class: "TrustedDevices::PurgeExpiredJob"
  queue: "default"

# Deletes sessions closed for more than 30 days (spec 02, D-576)
user_sessions_purge_expired:
  cron: "20 3 * * * America/Sao_Paulo"
  class: "UserSessions::PurgeExpiredJob"
  queue: "default"

# Tells the HR about the revisions that come into force on the day (spec 04, P-04-29, D-608)
employments_apply_scheduled_revisions:
  cron: "30 7 * * * America/Sao_Paulo"
  class: "Employments::ApplyScheduledRevisionsJob"
  queue: "default"

# Takes old notices out of the bell and deletes them after 1 year (spec 15, RN-15-090, D-608)
notifications_purge:
  cron: "30 3 * * * America/Sao_Paulo"
  class: "Notifications::PurgeJob"
  queue: "default"

# The free trial: notices 3 days and 1 day before the end, and the end (spec 19, RN-19-032, RN-19-034, D-616)
billing_trial:
  cron: "0 6 * * * America/Sao_Paulo"           # before the time-tracking peak
  class: "Billing::TrialJob"
  queue: "default"

# The employees of each company and contract on the day that ended, the end of the
# partner's pre-activation and the notices of the band (spec 19, RN-19-020 to RN-19-023, D-618)
billing_daily_usage:
  cron: "0 1 * * * America/Sao_Paulo"
  class: "Billing::DailyUsageJob"
  queue: "default"

# Closes the usage of the months before the current one (spec 19, RN-19-023, RN-19-024)
billing_close_period:
  cron: "30 1 * * * America/Sao_Paulo"          # after the day's usage
  class: "Billing::ClosePeriodJob"
  queue: "default"

# The invoices of the cycles that start in up to 3 days (spec 19, RN-19-040, RN-19-041, D-619)
billing_generate_invoices:
  cron: "0 2 * * * America/Sao_Paulo"           # after the month's usage is closed
  class: "Billing::GenerateInvoicesJob"
  queue: "default"

# Reads the pending PIX in Mercado Pago, for a lost webhook (spec 19, RN-19-046, CA-19-008, D-622)
billing_reconcile:
  cron: "30 2 * * * America/Sao_Paulo"          # after the day's invoices
  class: "Billing::ReconcileJob"
  queue: "default"

# Reads in Asaas the NFS-e without an answer, for a lost webhook (spec 19, RN-19-106, D-633)
billing_service_invoice_reconcile:
  cron: "40 2 * * * America/Sao_Paulo"          # after the PIX check, which may pay invoices
  class: "Billing::ServiceInvoiceReconcileJob"
  queue: "default"

# The cancellations that take effect, and the portfolios' notice (spec 19, RN-19-062, RN-19-063, D-625)
billing_cancellation:
  cron: "50 2 * * * America/Sao_Paulo"          # before the dunning
  class: "Billing::CancellationJob"
  queue: "default"

# The dunning schedule: notices, read only and closing (spec 19, RN-19-050, D-624)
billing_dunning:
  cron: "0 3 * * * America/Sao_Paulo"           # after the PIX check
  class: "Billing::DunningJob"
  queue: "default"

# The next year's national holidays from BrasilAPI, for the team's review (spec 06, P-06-20,
# spec 11, P-11-06, D-638). Two months ahead, so they are published before the year starts.
holidays_import_national:
  cron: "0 4 1 11 * America/Sao_Paulo"         # every November 1st
  class: "Holidays::ImportNationalJob"
  queue: "default"

# Reminds the superadmins of the quarterly restore drill (spec 20, RN-20-046, D-627). The
# daily pg_dump is the Railway `backup` service, not a Sidekiq job (RN-20-041).
infra_restore_drill_reminder:
  cron: "0 9 1 1,4,7,10 * America/Sao_Paulo"
  class: "Infra::RestoreDrillReminderJob"
  queue: "default"

# Files still in virus scanning an hour after the last attempt, back to the queue (P-05-30,
# RN-20-015, D-640)
antivirus_rescan_pending:
  cron: "40 * * * * America/Sao_Paulo"          # every hour
  class: "Antivirus::RescanPendingJob"
  queue: "default"

# Items of processes past their date, to who answers for them and the HR (spec 06,
# RN-06-028, D-641)
processes_overdue_items:
  cron: "30 6 * * * America/Sao_Paulo"
  class: "Processes::OverdueItemsJob"
  queue: "default"

# The documents' expirations and their notice (spec 08, RN-08-031, RN-08-032, D-643).
documents_expirations:
  cron: "20 6 * * * America/Sao_Paulo"
  class: "Documents::ExpirationsJob"
  queue: "default"

# The deleted documents' files after 30 days and the folders' ZIPs after 24 hours, and the
# batches about to expire (spec 08, RN-08-062, RN-08-082, RN-08-083, D-644).
documents_purge_deleted:
  cron: "50 3 * * * America/Sao_Paulo"
  class: "Documents::PurgeDeletedJob"
  queue: "default"

documents_batch_expirations:
  cron: "40 6 * * * America/Sao_Paulo"
  class: "Documents::BatchExpirationsJob"
  queue: "default"
