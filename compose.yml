# Desenvolvimento local (spec 20, RN-20-034, D-587).
# Uso: docker compose up    (web em http://aurora.painel.localhost:3300)
# Postgres e Redis também ficam expostos na máquina, em portas diferentes das padrão,
# para os testes e para quem usar um cliente de banco.
# Nome fixo: os volumes (catalystrh_*) não dependem do nome da pasta.
name: catalystrh

x-app: &app
  image: catalyst_hr-dev
  build:
    context: .
    dockerfile: Dockerfile.dev
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    CLAMAV_HOST: clamav
  volumes:
    - .:/rails
    - bundle:/usr/local/bundle
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  web:
    <<: *app
    ports:
      - "3300:3000"
    # Para o `debugger`: docker compose attach web
    stdin_open: true
    tty: true

  css:
    <<: *app
    # "always" mantém o watch rodando sem terminal interativo.
    command: ["bin/rails", "tailwindcss:watch[always]"]

  worker:
    <<: *app
    command: ["bundle", "exec", "sidekiq"]

  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data

  # Antivírus dos uploads (P-05-30, D-640). Imagem com arm64 e amd64 (a clamav/clamav só
  # tem amd64). A primeira subida baixa as assinaturas e leva alguns minutos; até lá, os
  # uploads ficam em varredura. A documentação pede no mínimo 3 GiB de RAM.
  clamav:
    image: clamav/clamav-debian:1.5
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  bundle:
  postgres_data:
  redis_data:
  clamav_data:
